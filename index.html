<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
      (() => {
        let preference = new URLSearchParams(window.location.search).get("scoutTheme");
        if (preference !== "light" && preference !== "dark") {
          try {
            preference = JSON.parse(localStorage.getItem("cortex.v1"))?.settings?.theme || "system";
          } catch (error) {
            console.warn("Theme preference could not be read:", error.name);
          }
        }
        document.documentElement.setAttribute("data-theme", preference === "light" || preference === "dark" ?
          preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <title data-i18n="app.title">Cortex</title>
    <meta name="description" content="A calm, local-first daily practice space for memory, attention and reasoning.">
    <meta name="theme-color" content="#f3f5ef">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cortex">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <script src="i18n.js" defer></script>
    <script src="js/core.js" defer></script>
    <script src="js/generators.js" defer></script>
    <script src="js/runner.js" defer></script>
    <script src="js/tasks/span-and-speed.js" defer></script>
    <script src="js/tasks/focus.js" defer></script>
    <script src="js/tasks/reasoning.js" defer></script>
    <script src="js/tasks/learning.js" defer></script>
    <script src="js/tasks/inhibition.js" defer></script>
    <script src="js/tasks/spatial.js" defer></script>
    <script src="js/routine.js" defer></script>
    <script src="js/forecasting.js" defer></script>
    <script src="js/pwa.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#app" data-i18n="nav.skip">Skip to content</a>
    <header id="header">
      <div class="shell">
        <div class="header-inner">
          <a class="brand" href="#home">
            <svg class="brand-mark" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
              <rect class="brand-tile" width="32" height="32" rx="8"></rect>
              <path d="M13 5H9L4 10v12l5 5h4M19 5h4l5 5v12l-5 5h-4M12 11h8M12 16h8M12 21h8"></path>
            </svg>
            <span class="brand-text">Cortex<small><span data-i18n="app.tagline"></span></small></span>
          </a>
          <nav class="main-nav" data-i18n-aria="nav.main">
            <a href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/></svg><span data-i18n="nav.home">Today</span></a>
            <a href="#library"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span data-i18n="nav.library">Exercises</span></a>
            <a href="#results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 14l5-5 4 3 5-7"/></svg><span data-i18n="nav.results">Progress</span></a>
          </nav>
          <div class="header-controls">
            <button id="open-settings" class="secondary" type="button" data-i18n="preferences.title">Settings</button>
          </div>
        </div>
      </div>
    </header>

    <div id="notifications" class="shell" aria-live="polite" aria-atomic="true"></div>
    <main id="app" class="shell" tabindex="-1"></main>
    <noscript><p class="shell">Cortex needs JavaScript to run its exercises. Enable JavaScript and reload. No account is required.</p></noscript>

    <section id="runner" hidden aria-describedby="runner-description">
      <canvas id="stage" tabindex="0" role="img" aria-describedby="runner-description"></canvas>
      <div id="runner-hud"><span id="runner-task-label"></span><span id="runner-phase"></span></div>
      <div id="response-controls" data-i18n-aria="runner.responses"></div>
      <div id="runner-description" class="visually-hidden" data-i18n="runner.description"></div>
      <div id="response-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <button id="abort" type="button" data-i18n="runner.abort"></button>
      <div id="runner-message" role="alert" aria-live="assertive"></div>
    </section>

    <dialog id="preferences-dialog" aria-labelledby="preferences-heading">
      <div class="section-heading">
        <h2 id="preferences-heading" data-i18n="preferences.title">Settings</h2>
        <button id="close-preferences" type="button" class="secondary" data-i18n="common.close">Close</button>
      </div>
      <form id="preferences-form" class="stack"></form>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-heading">
      <div class="section-heading">
        <h2 id="settings-heading" data-i18n="settings.title"></h2>
        <button id="close-settings" type="button" class="secondary" data-i18n="common.close"></button>
      </div>
      <form id="settings-form" class="stack"></form>
    </dialog>

    <footer class="shell">
      <div class="inline"><span class="local-indicator" aria-hidden="true"></span><span data-i18n="app.localOnly"></span></div>
      <nav class="footer-nav" data-i18n-aria="nav.more">
        <a href="#data" data-i18n="nav.data"></a>
        <a href="#reliability" data-i18n="nav.reliability"></a>
        <a href="#about" data-i18n="nav.about"></a>
        <button id="app-update" class="secondary" type="button" hidden data-i18n="pwa.update"></button>
      </nav>
    </footer>
  </body>
</html>
